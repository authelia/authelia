<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Christian Koepp">
  <style>
    svg { color-scheme: light dark }
    .ring { stroke: rgba(24, 24, 27, 0.12) }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: rgba(250, 250, 250, 0.14) }
    }
  </style>
  <defs>
    <clipPath id="avatar" clipPathUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.5" /></clipPath>
  </defs>
  <image href="data:image/jpeg;base64," x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)" />
  <circle cx="20.0" cy="20.0" r="19.5" fill="none" class="ring" stroke-width="1" />
</svg>
