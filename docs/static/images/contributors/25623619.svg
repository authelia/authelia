<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100" role="img" aria-label="fbird">
  <style>
    svg { color-scheme: light dark }
    .muted { fill: #71717a } .name { fill: #3f3f46 }
    .ring { stroke: rgba(24, 24, 27, 0.12) }
    @media (prefers-color-scheme: dark) {
      .muted { fill: #a1a1aa } .name { fill: #d4d4d8 }
      .ring { stroke: rgba(250, 250, 250, 0.14) }
    }
  </style>
  <defs>
    <clipPath id="avatar" clipPathUnits="objectBoundingBox"><circle cx="0.5" cy="0.5" r="0.5" /></clipPath>
  </defs>
  <image href="data:image/jpeg;base64," x="32.0" y="0" width="56" height="56" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)" />
  <circle cx="60.0" cy="28.0" r="28.5" fill="none" class="ring" stroke-width="1" />
  <text x="60.0" y="73" text-anchor="middle" font-size="11" font-weight="500" font-family="'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" class="name">fbird</text>
  <text x="60.0" y="91" text-anchor="middle" font-size="11" letter-spacing="0.5" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif" class="muted">🚇💻📖</text>
</svg>
