---
runner:
  docs:
    cmd: pnpm -C docs exec eslint --format rdjson .
    format: rdjson
    level: error

  eslint:
    cmd: pnpm -C web exec eslint --format rdjson .
    format: rdjson
    level: error

  golangci:
    cmd: golangci-lint run
    errorformat:
      - '%E%f:%l:%c: %m'
      - '%E%f:%l: %m'
      - '%C%.%#'
    level: error

  shellcheck:
    cmd: .buildkite/steps/lint.sh shellcheck --format=gcc
    errorformat:
      - '%f:%l:%c: %trror: %m'
      - '%f:%l:%c: %tarning: %m'
      - '%f:%l:%c: %tote: %m'
    level: error

  typos:
    cmd: typos --format brief .
    errorformat:
      - '%f:%l:%c: %m'
    level: error

  yamllint:
    cmd: yamllint -f parsable .
    errorformat:
      - '%f:%l:%c: %m'
    level: error
...
