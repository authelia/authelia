ignore:
  - vulnerability: CVE-2026-38753
    package:
      name: busybox
      version: 1.38.0
      type: binary
    reason: |
      Explicitly patched in authelia/base. The reported version string is unchanged from upstream busybox 1.38.0
      so grype still flags it, but the vulnerable code paths have been backported.
  - vulnerability: CVE-2026-38754
    package:
      name: busybox
      version: 1.38.0
      type: binary
    reason: |
      Explicitly patched in authelia/base. The reported version string is unchanged from upstream busybox 1.38.0
      so grype still flags it, but the vulnerable code paths have been backported.
  - vulnerability: CVE-2026-38755
    package:
      name: busybox
      version: 1.38.0
      type: binary
    reason: |
      Explicitly patched in authelia/base. The reported version string is unchanged from upstream busybox 1.38.0
      so grype still flags it, but the vulnerable code paths have been backported.
  - package:
      location: "**/lefthook*/**"
    reason: |
      Any dependency (Go stdlib, golang.org/x/* modules, etc.) statically embedded in the lefthook prebuilt
      binaries (npm devDependency). Lefthook is a developer/CI git hook runner only; not shipped in any Authelia
      runtime artifact. Scoped by source path so this never accidentally hides findings from Authelia's own
      binaries.
  - package:
      location: "**/@typescript/typescript-*/**"
    reason: |
      Any dependency (Go stdlib, golang.org/x/* modules, etc.) statically embedded in the TypeScript 7 native
      compiler binaries (npm devDependency). TypeScript 7 is written in Go and its platform packages ship a
      prebuilt `tsc`; the compiler only runs at build time and is not shipped in any Authelia runtime artifact.
      Scoped by source path so this never accidentally hides findings from Authelia's own binaries.
