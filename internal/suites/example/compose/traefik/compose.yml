---
services:
  traefik:
    cpus: 2
    mem_limit: 1g
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './example/compose/traefik/config:/config'
      - './common/pki:/pki'
    labels:
      traefik.enable: 'true'
      traefik.http.routers.api.rule: 'Host(`traefik.example.com`)'
      traefik.http.routers.api.entrypoints: 'https'
      traefik.http.routers.api.service: 'api@internal'
      traefik.http.routers.api.tls: 'true'
      traefik.http.middlewares.authelia.forwardAuth.address: 'https://authelia-backend:9091${PathPrefix:-}/api/authz/forward-auth'  # yamllint disable-line rule:line-length
      traefik.http.middlewares.authelia.forwardAuth.tls.insecureSkipVerify: 'true'
      traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      traefik.http.middlewares.authelia.forwardAuth.maxResponseBodySize: '8192'
      traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Authorization,Proxy-Authorization,Remote-User,Remote-Groups,Remote-Email,Remote-Name'  # yamllint disable-line rule:line-length
    command:
      - '--configFile=/config/static.yml'
      # Every suite labels its containers identically, so on a shared daemon this instance would
      # otherwise discover other projects' containers and collide on router names. Passed as CLI
      # arguments because those take precedence over the config file, whereas environment variables
      # do not.
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-authelia}`)'
      - '--providers.docker.network=${COMPOSE_PROJECT_NAME:-authelia}_authelianet'
    networks:
      authelianet:
        aliases:
          - login.example.com
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.100
...
