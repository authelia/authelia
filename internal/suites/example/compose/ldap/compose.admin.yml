---
services:
  openldap-admin:
    image: 'osixia/phpldapadmin:0.9.0'
    cpus: 2
    mem_limit: 1g
    ports:
      - '${LDAP_ADMIN_PORT:-9090}:80'
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: 'openldap'
      PHPLDAPADMIN_HTTPS: 'false'
    networks:
      authelianet: {}
...
