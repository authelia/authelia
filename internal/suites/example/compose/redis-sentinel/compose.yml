---
services:
  redis-node-0:
    image: 'redis:8.10-alpine'
    cpus: 2
    mem_limit: 1g
    command: '/entrypoint.sh master'
    environment: &redis-env
      SUITE_SUBNET: '${SUITE_SUBNET:-192.168.240}'
    healthcheck: &node-health
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
      interval: '3s'
      timeout: '5s'
      retries: 5
      start_period: '60s'
    volumes:
      - './example/compose/redis/templates:/templates'
      - './example/compose/redis/users.acl:/data/users.acl'
      - './example/compose/redis/entrypoint.sh:/entrypoint.sh'
    networks:
      authelianet:
        aliases:
          - 'redis-node-0.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.110
  redis-node-1:
    image: 'redis:8.10-alpine'
    cpus: 2
    mem_limit: 1g
    command: '/entrypoint.sh slave'
    depends_on: &deps
      redis-node-0:
        condition: 'service_healthy'
    environment: *redis-env
    healthcheck: *node-health
    volumes:
      - './example/compose/redis/templates:/templates'
      - './example/compose/redis/users.acl:/data/users.acl'
      - './example/compose/redis/entrypoint.sh:/entrypoint.sh'
    networks:
      authelianet:
        aliases:
          - 'redis-node-1.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.111
  redis-node-2:
    image: 'redis:8.10-alpine'
    cpus: 2
    mem_limit: 1g
    command: '/entrypoint.sh slave'
    depends_on: *deps
    environment: *redis-env
    healthcheck: *node-health
    volumes:
      - './example/compose/redis/templates:/templates'
      - './example/compose/redis/users.acl:/data/users.acl'
      - './example/compose/redis/entrypoint.sh:/entrypoint.sh'
    networks:
      authelianet:
        aliases:
          - 'redis-node-2.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.112
  redis-sentinel-0:
    image: 'redis:8.10-alpine'
    cpus: 2
    mem_limit: 1g
    command: '/entrypoint.sh sentinel'
    depends_on: &deps-sentinel
      <<: *deps
      redis-node-1:
        condition: 'service_healthy'
      redis-node-2:
        condition: 'service_healthy'
    environment: *redis-env
    healthcheck: &sentinel-health
      test: [ 'CMD-SHELL', 'redis-cli -p 26379 -a sentinel-server-password ping || exit 1' ]
      interval: '3s'
      timeout: '5s'
      retries: 5
      start_period: '60s'
    volumes:
      - './example/compose/redis/templates:/templates'
      - './example/compose/redis/entrypoint.sh:/entrypoint.sh'
    networks:
      authelianet:
        aliases:
          - 'redis-sentinel-0.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.120
  redis-sentinel-1:
    image: 'redis:8.10-alpine'
    cpus: 2
    mem_limit: 1g
    command: '/entrypoint.sh sentinel'
    depends_on: *deps-sentinel
    environment: *redis-env
    healthcheck: *sentinel-health
    volumes:
      - './example/compose/redis/templates:/templates'
      - './example/compose/redis/entrypoint.sh:/entrypoint.sh'
    networks:
      authelianet:
        aliases:
          - 'redis-sentinel-1.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.121
  redis-sentinel-2:
    image: 'redis:8.10-alpine'
    cpus: 2
    mem_limit: 1g
    command: '/entrypoint.sh sentinel'
    depends_on: *deps-sentinel
    environment: *redis-env
    healthcheck: *sentinel-health
    volumes:
      - './example/compose/redis/templates:/templates'
      - './example/compose/redis/entrypoint.sh:/entrypoint.sh'
    networks:
      authelianet:
        aliases:
          - 'redis-sentinel-2.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.122
  authelia-backend:
    depends_on:
      redis-node-0:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-sentinel-0:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
...
