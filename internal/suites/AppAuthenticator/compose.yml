---
services:
  authelia-backend:
    volumes:
      - './AppAuthenticator/configuration.yml:/config/configuration.yml'
      - './AppAuthenticator/users.yml:/config/users.yml'
      - './common/pki:/pki'
      - './common/pki/public.crt:/certs/public.crt'
      - '${SUITE_TMP:-/tmp}:/tmp'
    user: ${USER_ID}:${GROUP_ID}
...
