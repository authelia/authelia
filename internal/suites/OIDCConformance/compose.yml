---
services:
  authelia-backend:
    environment:
      X_AUTHELIA_CONFIG_FILTERS: 'template'
      X_AUTHELIA_CONFIG: '/config/configuration.yml,/tmp/conformance-clients.yml'
    volumes:
      - './OIDCConformance/configuration.yml:/config/configuration.yml'
      - './OIDCConformance/users.yml:/config/users.yml'
      - './common/pki:/pki'
      - './common/pki/public.crt:/certs/public.crt'
      - '${SUITE_TMP:-/tmp}:/tmp'

  conformance-mongodb:
    image: 'mongo:6.0.13'
    cpus: 2
    mem_limit: 2g
    networks:
      authelianet: {}

  conformance-server:
    build:
      context: '.'
      dockerfile: 'OIDCConformance/Dockerfile.server'
    cpus: 4
    mem_limit: 4g
    environment:
      BASE_URL: 'https://conformance.example.com:8443'
      MONGODB_HOST: 'conformance-mongodb'
      JAVA_EXTRA_ARGS: '-Dfintechlabs.devmode=true'
      # The image's entrypoint interpolates these four unconditionally, unlike the signing keys beside them which are
      # wrapped in '${VAR:+...}'. Leaving them unset yields an empty system property rather than an absent one, and a
      # system property outranks the suite's own application.properties, whose defaults these values reproduce. Spring
      # then rejects the empty client id while constructing OAuth2ClientProperties and the application context fails
      # with "Client id of registration 'gitlab' must not be empty" -- before the devmode fallback in
      # WebSecurityOidcLoginConfig can be reached. Nothing here logs in through Google or GitLab; devmode disables that
      # login entirely. These exist only so the properties are non-empty.
      OIDC_GOOGLE_CLIENTID: 'google-client'
      OIDC_GOOGLE_SECRET: 'google-secret'
      OIDC_GITLAB_CLIENTID: 'gitlab-client'
      OIDC_GITLAB_SECRET: 'gitlab-secret'
    depends_on:
      - 'conformance-mongodb'
      - 'authelia-backend'
    expose:
      - 8080
    networks:
      authelianet:
        aliases:
          # The published nginx image proxies to http://server:8080 and that configuration is baked in.
          - 'server'

  conformance-nginx:
    image: 'registry.gitlab.com/openid/conformance-suite/nginx:release-v5.2.4'
    cpus: 1
    mem_limit: 512m
    depends_on:
      - 'conformance-server'
    volumes:
      - './common/pki/public.chain.pem:/etc/ssl/certs/nginx-selfsigned.crt'
      - './common/pki/private.pem:/etc/ssl/private/nginx-selfsigned.key'
    networks:
      authelianet:
        aliases:
          - 'conformance.example.com'
        ipv4_address: ${SUITE_SUBNET:-192.168.240}.140
...
