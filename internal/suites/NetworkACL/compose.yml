---
services:
  authelia-backend:
    environment:
      # The access control networks are subnet relative, and compose does not interpolate an Authelia configuration
      # file, so the template filter resolves them at load time instead.
      X_AUTHELIA_CONFIG_FILTERS: 'template'
      SUITE_SUBNET: '${SUITE_SUBNET:-192.168.240}'
    volumes:
      - './NetworkACL/configuration.yml:/config/configuration.yml'
      - './NetworkACL/users.yml:/config/users.yml'
      - './common/pki:/pki'
      - './common/pki/public.crt:/certs/public.crt'
...
